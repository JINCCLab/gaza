# Next.js frontend at /frontend (monorepo).
# If a Netlify site already set Base directory = frontend in the UI, this matches
# that layout and keeps Deploy Previews building the App Router app — not the repo root.

[build]
  base = "frontend"
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Secrets: set in Netlify UI → Environment variables (do not put sk_/pk_ here).
# Required for Clerk UI on deployed sites:
#   NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
#   NEXT_PUBLIC_API_URL   # public FastAPI origin, no trailing slash
