# Overlay: wire API + worker to MinIO (S3-compatible).
#
#   docker compose -f docker-compose.yml -f docker-compose.s3.yml --profile s3 up --build \
#     db redis minio minio-init api worker
#
# Console: http://127.0.0.1:9001 (minioadmin / minioadmin)
# For host-run API against Compose MinIO:
#   STORAGE_BACKEND=s3 S3_ENDPOINT_URL=http://127.0.0.1:9000 \
#   S3_ACCESS_KEY_ID=minioadmin S3_SECRET_ACCESS_KEY=minioadmin S3_BUCKET=dataplat

services:
  minio:
    profiles: ["s3"]
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  minio-init:
    profiles: ["s3"]
    image: minio/mc:RELEASE.2024-11-17T19-35-56Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 minioadmin minioadmin
        mc mb -p local/dataplat || true
        mc anonymous set none local/dataplat || true
        echo "bucket dataplat ready"

  api:
    environment:
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET: dataplat
      S3_MEDIA_PREFIX: media/
      S3_EXPORTS_PREFIX: exports/
    depends_on:
      minio-init:
        condition: service_completed_successfully

  worker:
    environment:
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET: dataplat
      S3_MEDIA_PREFIX: media/
      S3_EXPORTS_PREFIX: exports/
    depends_on:
      minio-init:
        condition: service_completed_successfully

volumes:
  minio_data:
