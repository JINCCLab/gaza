# Local / prod-like stack: PostgreSQL + Redis + FastAPI + verify worker (+ optional UI / MinIO).
# Default demo without Compose still uses SQLite (DATABASE_URL unset) + local disk storage.
#
#   docker compose up --build db redis api worker
#   docker compose --profile ui up --build
#   docker compose -f docker-compose.yml -f docker-compose.s3.yml --profile s3 up --build
#
# Schema: startup Base.metadata.create_all (+ SQLite-only column patches).
# No Alembic yet — see docs/mvp-slice-runbook.md § Database.
# Verify: API enqueues to Redis; worker runs the same run_automated_stages pipeline.
# Sync fallback: VERIFY_MODE=sync or Redis down → inline verify on the request thread.
# Storage: local volumes by default; S3/MinIO via docker-compose.s3.yml + profile s3.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dataplat
      POSTGRES_PASSWORD: dataplat
      POSTGRES_DB: data_platform
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dataplat -d data_platform"]
      interval: 3s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://dataplat:dataplat@db:5432/data_platform
      REDIS_URL: redis://redis:6379/0
      VERIFY_MODE: async
      AUTH_MODE: dev
      DEV_JWT_SECRET: phase0-dev-jwt-secret-change-me
      STORAGE_BACKEND: local
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - api_data:/repo/data
      - api_exports:/repo/exports

  worker:
    build:
      context: ./backend
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://dataplat:dataplat@db:5432/data_platform
      REDIS_URL: redis://redis:6379/0
      AUTH_MODE: dev
      DEV_JWT_SECRET: phase0-dev-jwt-secret-change-me
      STORAGE_BACKEND: local
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Share media uploads with API so CV storage_key verification works (local backend)
      - api_data:/repo/data
      - api_exports:/repo/exports

  frontend:
    profiles: ["ui"]
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - api

  # Optional S3-compatible store — enable with --profile s3 (+ docker-compose.s3.yml for API env).
  minio:
    profiles: ["s3"]
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

volumes:
  pgdata:
  api_data:
  api_exports:
  minio_data:
